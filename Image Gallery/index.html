<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina – photo gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/></svg>
      </span>
      <span class="logo-text">Lumina</span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search title, description, or tags..." aria-label="Search photos" autocomplete="off">
    </label>
    <button class="pill" id="favBtn" aria-pressed="false">♥ Favorites <span class="count" id="favCount">0</span></button>
    <button class="pill" id="addBtn">+ Add photos</button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <div class="seg" role="group" aria-label="Layout">
      <button data-view="grid" aria-pressed="true">Grid</button>
      <button data-view="masonry" aria-pressed="false">Masonry</button>
    </div>
  </div>

  <main id="gallery" class="gallery view-grid"></main>
  <p class="empty" id="empty" hidden>No photos match. Try another search or category.</p>
</div>

<dialog id="addDlg">
  <form id="addForm">
    <h2>Add photos</h2>
    <label class="drop" id="drop">
      <input type="file" id="files" accept="image/*" multiple>
      <strong>Choose photos</strong>
      <span>or drop them here</span>
      <em id="fileInfo"></em>
    </label>
    <label class="field">Category <select id="addCat"></select></label>
    <label class="field">Tags (comma separated, optional) <input id="addTags" type="text" placeholder="sunset, beach"></label>
    <p class="hint">Photos added here last until you refresh. To keep them, put the files in the images folder.</p>
    <div class="actions">
      <button type="button" class="pill" id="addCancel">Cancel</button>
      <button type="submit" class="pill primary">Add to gallery</button>
    </div>
  </form>
</dialog>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <button class="lbtn close" id="lbClose" aria-label="Close viewer">&times;</button>
  <button class="lbtn prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
  <button class="lbtn next" id="lbNext" aria-label="Next photo">&#8250;</button>
  <div class="stage"><img id="lbImg" alt=""></div>
  <div class="info">
    <div><b id="lbTitle"></b><p id="lbDesc"></p><span id="lbMeta"></span></div>
    <button class="heart" id="lbFav" aria-label="Favorite" aria-pressed="false"></button>
  </div>
</div>

<script src="photos.js"></script>
<script src="script.js"></script>
</body>
</html>
