<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <div class="top">
      <span class="brand">Syrix Calculator</span>
      <div class="tools">
        <button class="tool" id="sound" aria-label="Toggle sound">🔊</button>
        <button class="tool" id="hist" aria-label="History">🕘</button>
      </div>
    </div>

    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>

    <div class="keys" id="keys">
      <button class="k mem" data-a="mc">MC</button>
      <button class="k mem" data-a="mr">MR</button>
      <button class="k mem" data-a="m+">M+</button>
      <button class="k mem" data-a="m-">M-</button>

      <button class="k danger" data-a="ac">AC</button>
      <button class="k danger" data-a="del">DEL</button>
      <button class="k op" data-a="sqrt">√</button>
      <button class="k op" data-a="op" data-v="/">÷</button>

      <button class="k op" data-a="sq">x²</button>
      <button class="k op" data-a="pct">%</button>
      <button class="k op" data-a="neg">±</button>
      <button class="k op" data-a="op" data-v="*">×</button>

      <button class="k" data-a="num" data-v="7">7</button>
      <button class="k" data-a="num" data-v="8">8</button>
      <button class="k" data-a="num" data-v="9">9</button>
      <button class="k op" data-a="op" data-v="-">−</button>

      <button class="k" data-a="num" data-v="4">4</button>
      <button class="k" data-a="num" data-v="5">5</button>
      <button class="k" data-a="num" data-v="6">6</button>
      <button class="k op" data-a="op" data-v="+">+</button>

      <button class="k" data-a="num" data-v="1">1</button>
      <button class="k" data-a="num" data-v="2">2</button>
      <button class="k" data-a="num" data-v="3">3</button>
      <button class="k eq" data-a="eq">=</button>

      <button class="k wide" data-a="num" data-v="0">0</button>
      <button class="k" data-a="dot">.</button>
    </div>

    <section class="history" id="panel" aria-label="History">
      <div class="history-top">
        <strong>History</strong>
        <span>
          <button class="hbtn" id="clearHist">Clear</button>
          <button class="hbtn" id="closeHist">Close</button>
        </span>
      </div>
      <ul id="list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
